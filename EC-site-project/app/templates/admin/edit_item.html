<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品編集</title>
</head>
<body>
    <header>
        <nav>
        <a href="{{ url_for('admin.list_items') }}">商品管理画面</a>
        <a href="{{ url_for('admin.order') }}">注文管理画面</a>
        </nav>
    </header>    
   <h1>商品編集</h1>

<form method="POST" enctype="multipart/form-data">
  <div>
    商品名<br>
    <input type="text" name="itemName" value="{{ item.itemName }}">
  </div>

  <div>
    カテゴリ<br>
    <input type="text" name="categoryName" value="{{ item.categoryName }}">
  </div>

  <div>
    説明<br>
    <textarea name="itemDetail">{{ item.itemDetail }}</textarea>
  </div>

  <div>
    価格<br>
    <input type="number" name="price" value="{{ item.price }}">
  </div>

  <div>
    在庫<br>
    <input type="number" name="stock" value="{{ item.stock }}">
  </div>

  <div>
    <input type="checkbox" name="recmdFlg" {% if item.recmdFlg %}checked{% endif %}>
    おすすめ
  </div>

  <div>
    画像<br>
    <input type="file" name="imageFile">
  </div>

  <button type="submit">更新</button>
</form>

<style>
    /* ===== ヘッダー全体 ===== */
header {
    background: linear-gradient(135deg, #2c3e50, #4ca1af);
    padding: 15px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* ===== ナビゲーション ===== */
nav {
    display: flex;
    gap: 20px;
    align-items: center;
}

/* ===== リンク ===== */
nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 20px;
    transition: 0.3s;
}

/* ===== ホバー時 ===== */
nav a:hover {
    background-color: rgba(255,255,255,0.2);
    transform: translateY(-2px);
}

/* ===== アクティブっぽくする ===== */
nav a.active {
    background-color: white;
    color: #2c3e50;
}

/* ===== ページ全体少し整える ===== */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f5f7fa;
}

/* ===== タイトル ===== */
h1 {
    margin: 20px;
    color: #333;
}
</style>
</body>
</html>
