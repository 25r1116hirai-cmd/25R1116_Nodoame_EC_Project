<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>商品編集</title>
</head>
<body>
    <h1>商品編集</h1>

    <form action="{{ url_for('admin.edit_item', item_id=item.itemId) }}" method="post" enctype="multipart/form-data">
    <label for="itemName">商品名</label>
    <input type="text" id="itemName" name="itemName" value="{{ item.itemName }}" required>

    <label for="itemDetail">商品詳細</label>
    <textarea id="itemDetail" name="itemDetail" rows="5">{{ item.itemDetail }}</textarea>

    <label for="categoryName">カテゴリ</label>
<input type="text" id="categoryName" name="categoryName" value="{{ item.categoryName }}">

    <label for="price">価格 (¥)</label>
    <input type="number" id="price" name="price" value="{{ item.price }}" min="0" required>

    <label for="stock">在庫</label>
    <input type="number" id="stock" name="stock" value="{{ item.stock }}" min="0" required>

    <label>
        <input type="checkbox" name="recmdFlg" value="1" {% if item.recmdFlg %}checked{% endif %}>
        おすすめにする
    </label>

     <label for="imageFile">商品画像</label>
{% if item.imageName %}
    <img id="preview" src="{{ url_for('static', filename='img/' ~ item.imageName) }}?{{ item.updDate.timestamp() }}" alt="商品画像" width="150">
{% else %}
    <img id="preview" src="" alt="商品画像" width="150" style="display:none;">
{% endif %}
<input type="file" id="imageFile" name="imageFile" accept="image/*">

<script>
document.getElementById('imageFile').addEventListener('change', function(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('preview');
    if (!file) {
        preview.style.display = 'none';
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
    }
    reader.readAsDataURL(file);
});
</script>
    <button type="submit">更新する</button>
</form>
</body>
</html>
