<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者用ホーム画面</title>
</head>
<body>
    <header>
    <nav>
        <a href="{{ url_for('admin.dashboard') }}">ホームへ</a>
        <a href="{{ url_for('admin.product') }}">商品管理画面</a>
        <a href="{{ url_for('admin.order') }}">注文管理画面</a>
    </nav>
</header>
<div>
        <a href="{{ url_for('admin.product') }}">商品管理画面</a>
        <a href="{{ url_for('admin.order') }}">注文管理画面</a>
</div>

<style>
    body {
    margin: 0;
    font-family: sans-serif;
    background-color: #f5f5f5;

    /* 中央配置 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    height: 100vh;
}

/* ヘッダー */
header {
    position: absolute;
    top: 0;
    width: 100%;
    background-color: #333;
    padding: 15px 0;
    text-align: center;
}

header a {
    color: white;
    margin: 0 20px;
    text-decoration: none;
    font-size: 16px;
}

/* メインのリンクエリア(ボタン二つ)  */
div {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* 大きいボタン風 */
div a {
    display: block;
    width: 300px;
    padding: 20px;
    text-align: center;
    font-size: 20px;
    text-decoration: none;
    color: white;
    background-color: #007BFF;
    border-radius: 10px;
    transition: 0.3s;
}

/* ホバー(on カーソル) */
div a:hover {
    background-color: #0056b3;
    transform: scale(1.05);
}
</style>

</body>
</html>
