{% extends "base.html" %}
{% block content %}

<div class="main-container">
    <a href="{{ url_for('shop.index') }}" class="back-link">← 戻る</a>

    <div class="product-flex">
        <!-- 左側：画像 -->
        <div class="product-image-container">
            <img src="{{ url_for('static', filename='img/' ~ product.imageName) }}" alt="{{ product.itemName }}">
        </div>

        <!-- 右側：商品詳細 -->
        <div class="product-info">
            <span class="badge">おすすめ商品</span>
            <h1 class="product-title">{{ product.itemName }}</h1>
            <div class="product-price">¥{{ "{:,}".format(product.price) }}</div>

            <p class="product-description">{{ product.desc }}</p>

            {% include "shop/component/cart-controls.html" %}

            <button class="add-to-cart-btn">
                🛒 カートに追加する
            </button>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Simple EC Store. All rights reserved.
</footer>


<style>
:root {
    --accent-green: #10b981;
    --bg-light: #f9fafb;
    --text-gray: #6b7280;
    --border-color: #e5e7eb;
}

body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #ffffff;
    margin: 0;
    color: #1f2937;
}

/* ヘッダーは base.html 側にまとめてある前提 */

.main-container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.back-link {
    display: inline-block;
    text-decoration: none;
    color: var(--text-gray);
    font-size: 0.9rem;
    margin-bottom: 20px;
    padding: 5px 15px;
    border: 1px solid var(--border-color);
    border-radius: 5px;
}

.product-flex {
    display: flex;
    gap: 50px;
    align-items: flex-start;
}

.product-image-container {
    flex: 1.2;
}

.product-image-container img {
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}

.product-info {
    flex: 1;
}

.badge {
    background: #ecfdf5;
    color: var(--accent-green);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 15px;
}

.product-title {
    font-size: 2.2rem;
    margin: 0 0 10px 0;
}

.product-price {
    font-size: 1.8rem;
    color: var(--accent-green);
    font-weight: bold;
    margin-bottom: 20px;
}

.product-description {
    color: var(--text-gray);
    line-height: 1.6;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 20px;
}

.add-to-cart-btn {
    background: var(--accent-green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

footer {
    margin-top: 100px;
    text-align: center;
    padding: 30px;
    color: var(--text-gray);
    font-size: 0.8rem;
    border-top: 1px solid var(--border-color);
}
</style>

{% endblock %}
