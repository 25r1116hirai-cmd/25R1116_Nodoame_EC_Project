<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Simple EC Store</title>
    <style>
        :root {
            --accent-green: #10b981;
            --bg-light: #f9fafb;
            --text-gray: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            color: #1f2937;
        }

        /* ヘッダー */
        header {
            padding: 15px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .nav-btns { display: flex; gap: 10px; }
        .nav-btn {
            text-decoration: none;
            color: #374151;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* メインコンテンツ */
        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 5px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }

        .product-flex {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        /* 左側：画像 */
        .product-image-container {
            flex: 1.2;
        }
        .product-image-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* 右側：詳細 */
        .product-info {
            flex: 1;
        }
        .badge {
            background: #ecfdf5;
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        .product-title { font-size: 2.2rem; margin: 0 0 10px 0; }
        .product-price { font-size: 1.8rem; color: var(--accent-green); font-weight: bold; margin-bottom: 20px; }
        .product-description { color: var(--text-gray); line-height: 1.6; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }

        /* カートエリア */
        .stock-status { font-size: 0.9rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .stock-count { color: var(--accent-green); font-weight: bold; }

        .cart-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .quantity-picker {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .qty-btn {
            background: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .qty-input {
            width: 40px;
            text-align: center;
            border: none;
            font-weight: bold;
            font-size: 1rem;
        }
        
        .add-to-cart-btn {
            flex-grow: 1;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* アイコン的な補足情報 */
        .features {
            display: flex;
            justify-content: space-between;
            color: var(--text-gray);
            font-size: 0.8rem;
            text-align: center;
        }
        .feature-item { display: flex; flex-direction: column; gap: 5px; align-items: center; }

        footer {
            margin-top: 100px;
            text-align: center;
            padding: 30px;
            color: var(--text-gray);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🏪 Simple EC Store</div>
    <div class="nav-btns">
        <a href="{{ url_for('shop.index') }}" class="nav-btn">商品一覧</a>
        <a href="#" class="nav-btn">注文状況</a>
        <a href="#" class="nav-btn">カート</a>
    </div>
</header>

<div class="main-container">
    <a href="{{ url_for('shop.index') }}" class="back-link">← 戻る</a>

    <div class="product-flex">
        <div class="product-image-container">
            <img src="{{ product.image }}" alt="{{ product.name }}">
        </div>

        <div class="product-info">
            <span class="badge">おすすめ商品</span>
            <h1 class="product-title">{{ product.name }}</h1>
            <div class="product-price">¥{{ "{:,}".format(product.price) }}</div>
            
            <p class="product-description">{{ product.desc }}</p>

            <div class="stock-status">
                <span>在庫状況</span>
                <span class="stock-count">在庫あり（残り 8点）</span>
            </div>

            <div class="cart-controls">
                <div class="quantity-picker">
                    <button class="qty-btn">−</button>
                    <input type="text" class="qty-input" value="1" readonly>
                    <button class="qty-btn">+</button>
                </div>
                <button class="add-to-cart-btn">
                    🛒 カートに追加する
                </button>
            </div>


        </div>
    </div>
</div>

<footer>
    &copy; 2026 Simple EC Store. All rights reserved.
</footer>

</body>
</html>
