<div class="card">
  <img src="{{ url_for('static', filename='img/' ~ item.imageName) }}" alt="{{ item.itemName }}">
  <div class="card-body">
    <p class="name">{{ item.itemName }}</p>
    <p class="price">¥{{ "{:,}".format(item.price) }}</p>
    {% if show_btn %}
    <a href="{{ url_for('shop.detail', id=item.itemId) }}" class="btn">
      カートへ
    </a>
    {% endif %}
  </div>
</div>
