<div class="product-card">
    {% if isAdmin %}
    <div class="admin-edit-tag">在庫: {{ item.stock }}</div>
    {% endif %}

    <div class="img-container">
        <a href="{{ url_for('shop.detail', id=item.itemId) }}">
            <img src="{{ url_for('static', filename='img/' ~ item.imageName) }}" alt="{{ item.itemName }}">
        </a>
    </div>

    <div class="card-content">
        <h3 class="p-name">
            <a href="{{ url_for('shop.detail', id=item.itemId) }}">
                {{ item.itemName }}
            </a>
        </h3>
        <p class="p-price">¥{{ "{:,}".format(item.price) }}</p>

        {% if item.stock > 0 %}
        <a href="/cart/add/{{ item.itemId }}" class="btn-add">カートに入れる</a>
        {% else %}
        <span class="btn-add sold-out">売り切れ</span>
        {% endif %}
    </div>
</div>

<style>
/* 全体グリッド */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

/* 商品カード */
.product-card {
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  display: flex;
  flex-direction: column;
}

.product-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.15);
}

/* 画像コンテナ */
.img-container {
  width: 100%;
  height: 180px;
  background: #eee;
}

.img-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* カード内容 */
.card-content {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-grow: 1;
  justify-content: space-between;
}

/* 商品名 */
.p-name {
  font-weight: bold;
  font-size: 1rem;
  margin: 0;
  color: #1f2937;
}

/* 価格 */
.p-price {
  color: #10b981;
  font-weight: bold;
  font-size: 1.1rem;
  margin: 0;
}

/* カートボタン */
.btn-add {
  width: 100%;
  padding: 10px;
  background-color: #10b981;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: auto; /* 価格の下にぴったり配置 */
  box-sizing: border-box;
margin-top: auto;
}

.btn-add:hover {
  opacity: 0.9;
}

/* 売り切れ用スタイル */
.btn-add.sold-out {
  background-color: #9ca3af; /* グレー */
  cursor: not-allowed;       /* 押せないマーク */
  opacity: 0.7;              /* 少し薄く */
  pointer-events: none;      /* クリック不可 */
}

</style>
