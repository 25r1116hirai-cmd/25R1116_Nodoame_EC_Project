<div class="product-card {% if item.stock == 0 %}sold-out-card{% endif %}">
    {% if isAdmin %}
    <div class="admin-edit-tag">在庫: {{ item.stock }}</div>
    {% endif %}

    <div class="img-container">
        <a href="{{ url_for('shop.detail', id=item.itemId) }}">
            <img src="{{ url_for('static', filename='img/' ~ item.imageName) }}" alt="{{ item.itemName }}">
        </a>
    </div>

    <div class="card-content">
        <h3 class="p-name">
            <a href="{{ url_for('shop.detail', id=item.itemId) }}">
                {{ item.itemName }}</a>
        </h3>
        <p class="p-price">¥{{ "{:,}".format(item.price) }}</p>

        {% if item.stock > 0 %}
<a href="{{ url_for('checkout.add_to_cart', item_id=item.itemId) }}" class="btn">
    カートに入れる
</a>

{% else %}
<span class="btn sold-out">売り切れ</span>
{% endif %}
    </div>
</div>

<style>
  /* 商品カード */
.product-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    transition: 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);
}

/* 画像 */
.img-container {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: #eee;
}

.img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 中身 */
.card-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-grow: 1;
}

/* 商品名 */
.p-name {
    font-size: 1rem;
    font-weight: bold;
    margin: 0;
}

/* 価格 */
.p-price {
    color: #10b981;
    font-weight: bold;
}

/* ボタン（統一🔥） */
.btn {
    width: 100%;
    padding: 10px;
    background: #10b981;
    color: #fff;
    text-align: center;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-top: auto;
}

/* 売り切れ */
.sold-out-card {
    opacity: 0.7;              /* ちょい暗く */
}


</style>
