<div class="cart-controls">
                <span>数量</span>
                <div class="quantity-picker">
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span id="quantity" class="qty-input">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
            </div>

<style>
.cart-controls {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.quantity-picker {
    display: flex;
    align-items: center;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
}
    
.qty-btn {
    background: var(--bg-light);
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    font-size: 1.2rem;
}
.qty-input {
    width: 40px;
    text-align: center;
    font-weight: bold;
    font-size: 1rem;
}
</style>

<script>
function changeQty(amount) {
    const qty = document.getElementById("quantity");

    //  今の数字を取り出す
    let number = Number(qty.textContent);

    //  足す or 引く
    number = number + amount;

    //  1より小さくならないようにする
    if (number < 1) {
        number = 1;
    }

    //  新しい数字を画面に表示
    qty.textContent = number;
}
</script>
